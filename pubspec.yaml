name: witrack
description: WorkInsight Tracker — premium desktop time and activity tracking.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  go_router: ^17.0.0
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  intl: ^0.20.2
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.4
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.3
  build_runner: ^2.10.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
